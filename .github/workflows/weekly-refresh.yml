name: Weekly refresh

# Downloads the latest NHTSA flat files, rebuilds the Recall Radar database,
# and commits the small report files in reports/latest. The database itself is
# not committed. Runs Mondays and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write          # to commit reports/latest

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fails before touching reports/latest if the download looks truncated (see src/refresh.py).
      - name: Download, load, analyze, export
        run: python src/refresh.py --download

      - name: Commit refreshed reports
        run: |
          if [ -z "$(git status --porcelain reports/latest)" ]; then
            echo "reports/latest unchanged"
            exit 0
          fi
          through=$(python -c "import json; print(json.load(open('reports/latest/summary.json'))['data_through'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest
          git commit -m "Weekly data refresh (complaints through ${through})"
          git push
